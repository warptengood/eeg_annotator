[project]
name = "eeg-annotator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "mne>=1.12.1",
    "pandas>=2.3.3",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
build = [
    "pyinstaller>=6.20.0",
]
dev = [
    "black==24.2.0",
    "flake8==7.0.0",
    "memory-profiler==0.61.0",
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "pytest-qt==4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
markers = [
    "needs_edf: marks tests that require real EDF files in tests/data/ (skip if absent)",
]
